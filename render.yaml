services:
  - type: web
    name: sponsorscope-ai
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 server.py"
    healthCheckPath: "/api/health"
    envVars:
      - key: PORT
        value: 10000
      - key: TABPFN_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: OLLAMA_API_URL
        value: "http://localhost:11434/api/generate"
      - key: GEMMA_MODEL_NAME
        value: "gemma2:9b"
